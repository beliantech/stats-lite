name: Release DMG

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dmg-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: W92R66CF55

jobs:
  release-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Import Developer ID certificate
        env:
          DEV_ID_CERT_P12: ${{ secrets.DEV_ID_CERT_P12 }}
          DEV_ID_CERT_PASSWORD: ${{ secrets.DEV_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PATH="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -base64 18)"
          printf '%s' "$DEV_ID_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC_PATH" \
            -P "$DEV_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KC_PASS" "$KC_PATH"
          security list-keychains -d user -s "$KC_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KC_PATH"

      - name: Build StatsLite (Release, Developer ID, hardened runtime)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project StatsLite.xcodeproj \
            -scheme StatsLite \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES
          APP="build/Build/Products/Release/StatsLite.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/sign.txt"
          grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/sign.txt"
          grep -q "flags=0x10000(runtime)" "$RUNNER_TEMP/sign.txt"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/StatsLite.app"
          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST"
          APPVER="$(plutil -extract CFBundleShortVersionString raw \
            -o - "$PLIST")"
          TAGVER="${GITHUB_REF_NAME#v}"
          echo "tag=$TAGVER app=$APPVER"
          if [ "$TAGVER" != "$APPVER" ]; then
            echo "::error::version mismatch tag=$TAGVER app=$APPVER"
            plutil -p "$PLIST"
            exit 1
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/StatsLite.app"
          STAGE="dmg-root"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "StatsLite" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            StatsLite.dmg

      - name: Notarize DMG
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit StatsLite.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json \
            | tee "$RUNNER_TEMP/notary.json"
          STATUS="$(jq -r .status "$RUNNER_TEMP/notary.json")"
          echo "notary status: $STATUS"
          test "$STATUS" = "Accepted"

      - name: Staple and verify DMG
        run: |
          set -euo pipefail
          xcrun stapler staple StatsLite.dmg
          xcrun stapler validate StatsLite.dmg
          spctl -a -vv -t install StatsLite.dmg

      # actions/upload-artifact v4.6.2
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StatsLite-notarized-dmg
          path: StatsLite.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" StatsLite.dmg \
            --title "StatsLite $GITHUB_REF_NAME" \
            --verify-tag --generate-notes
